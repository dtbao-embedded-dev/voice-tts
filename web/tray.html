<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Voice TTS menu</title>
<link rel="stylesheet" href="/web/app.css">
<style>
/* The tray menu (tray.PopupMenu): one dark surface, a status header, then the
   entries in the order of tray.Tray.entries(). It is a desktop menu reached
   with a mouse, so rows are 32 px rather than iOS's 44, and the highlight is
   an inset systemBlue pill as in the macOS menus. The window around it is
   exactly as tall as .menu - the page reports its height on load. */

html, body {
  min-height: 0;
  height: auto;
  overflow: hidden;
  background: var(--surface);
}

.menu {
  padding: 6px;
  transform-origin: 100% 100%;   /* grows out of the corner at the tray icon */
}
.menu.enter { opacity: 0; transform: scale(0.97); }
.menu.in {
  opacity: 1; transform: none;
  /* Close to a critically damped spring: quick, no overshoot - nothing was
     thrown, so nothing should bounce. */
  transition: opacity 120ms ease-out, transform 180ms cubic-bezier(0.2, 0.9, 0.25, 1);
}

.head {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 8px 10px;
}
.head img { width: 30px; height: 30px; flex: none; }
.head__title {
  font-size: 0.875rem; font-weight: 600;
  letter-spacing: -0.01em; line-height: 1.2;
}
.head .status {
  margin: 2px 0 0;
  font-size: 0.75rem; line-height: 1.2;
  color: var(--label-2);
  letter-spacing: 0;
}
.head .status span:last-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.sep { height: 1px; margin: 5px 10px; background: var(--separator); }

.item {
  all: unset;
  box-sizing: border-box;
  display: flex; align-items: center; gap: 10px;
  width: 100%; height: 32px;
  padding: 0 10px;
  border-radius: 7px;
  font-size: 0.8125rem;
  letter-spacing: -0.005em;
  color: var(--label);
  cursor: default;
}
.item svg {
  width: 16px; height: 16px; flex: none;
  fill: none; stroke: var(--label-2); stroke-width: 1.6;
  stroke-linecap: round; stroke-linejoin: round;
}
.item.hot { background: var(--accent); }
.item.hot svg { stroke: #fff; }
.item.hot:active { background: var(--accent-press); }   /* on press, not release */

.item--quit { color: var(--red); }
.item--quit svg { stroke: var(--red); }
.item--quit.hot { background: var(--red); color: #fff; }
.item--quit.hot svg { stroke: #fff; }

.item.done, .item.done.hot { background: transparent; color: var(--green); }
.item.done svg { stroke: var(--green); }

@media (prefers-reduced-motion: reduce) {
  .menu.enter { transform: none; }
  .menu.in { transition: opacity 120ms ease-out; }
}
@media (prefers-contrast: more) {
  .item svg { stroke: var(--label); }
}
</style>
</head>
<body>

<div class="menu" id="menu" role="menu" aria-label="Voice TTS">
  <div class="head">
    <img src="/favicon.svg" alt="">
    <div>
      <div class="head__title" id="title">Voice TTS</div>
      <div class="status" id="status" data-state="loading">
        <span class="dot"></span><span id="statusText">Đang khởi động…</span>
      </div>
    </div>
  </div>
  <div class="sep"></div>
  <div id="items"></div>
</div>

<script>
'use strict';

// SF Symbols-like line icons on a 24 px grid: macwindow, globe, doc.on.doc,
// power, checkmark.
const ICONS = {
  show: '<rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M3 9h18"/>',
  browser: '<circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="3.8" ry="9"/><path d="M3 12h18"/>',
  copy: '<rect x="8.5" y="8.5" width="12" height="12" rx="2.5"/><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5"/>',
  quit: '<path d="M12 3.5v8"/><path d="M7.2 6.6a7.5 7.5 0 1 0 9.6 0"/>',
  done: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
};
const STATUS = {
  ready: 'Sẵn sàng', loading: 'Đang tải model…', error: 'Lỗi model', offline: 'Mất kết nối',
};

const $ = (id) => document.getElementById(id);
const menuEl = $('menu');
let info = null;
let buttons = [];
let hot = -1;
let busy = false;

const svg = (key) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[key] || ''}</svg>`;

function setHot(i) {
  hot = i;
  buttons.forEach((b, j) => b.classList.toggle('hot', j === i));
}

async function pick(i) {
  if (busy || i < 0) return;
  const { key } = info.items[i];
  const b = buttons[i];
  if (key !== 'copy') {
    window.pywebview.api.pick(key);
    return;
  }
  // Copying has nothing else to show for itself, so the row confirms it in
  // place before the menu closes.
  busy = true;
  const ok = await window.pywebview.api.pick(key);
  b.classList.add('done');
  b.innerHTML = svg(ok ? 'done' : 'copy') + `<span>${ok ? 'Đã chép URL' : 'Không chép được'}</span>`;
  setTimeout(() => window.pywebview.api.dismiss(), 650);
}

function render() {
  $('title').textContent = info.title;
  const list = $('items');
  list.textContent = '';
  buttons = info.items.map(({ key, label }, i) => {
    if (key === 'quit') {
      const sep = document.createElement('div');
      sep.className = 'sep';
      list.append(sep);
    }
    const b = document.createElement('button');
    b.className = `item item--${key}`;
    b.setAttribute('role', 'menuitem');
    b.tabIndex = -1;
    b.innerHTML = `${svg(key)}<span></span>`;
    b.lastChild.textContent = label;
    b.addEventListener('pointerenter', () => setHot(i));
    b.addEventListener('pointerdown', () => setHot(i));
    b.addEventListener('click', () => pick(i));
    list.append(b);
    return b;
  });
  list.addEventListener('pointerleave', () => setHot(-1));
}

async function refreshStatus() {
  let state = 'offline';
  try {
    state = (await (await fetch('/api/status', { cache: 'no-store' })).json()).state;
  } catch (_) { /* the server is in this process; this means it is going down */ }
  const s = $('status');
  s.dataset.state = state === 'offline' ? 'error' : state;
  $('statusText').textContent = `${STATUS[state] || state} · ${info.address}`;
}

window.menu = {
  // Called by tray.PopupMenu.open() just before the window is shown.
  open() {
    if (!info) return;
    busy = false;
    info.items.forEach(({ key, label }, i) => {
      buttons[i].classList.remove('done');
      buttons[i].innerHTML = `${svg(key)}<span></span>`;
      buttons[i].lastChild.textContent = label;
    });
    setHot(-1);
    refreshStatus();
    menuEl.classList.remove('in');
    menuEl.classList.add('enter');
    void menuEl.offsetWidth;  // commit the start state so the transition runs
    requestAnimationFrame(() => { menuEl.classList.remove('enter'); menuEl.classList.add('in'); });
  },
};

document.addEventListener('keydown', (e) => {
  const n = buttons.length;
  if (e.key === 'Escape') window.pywebview.api.dismiss();
  else if (e.key === 'ArrowDown') setHot((hot + 1) % n);
  else if (e.key === 'ArrowUp') setHot((hot - 1 + n) % n);
  else if (e.key === 'Enter' || e.key === ' ') pick(hot);
  else return;
  e.preventDefault();
});
document.addEventListener('contextmenu', (e) => e.preventDefault());

window.addEventListener('pywebviewready', async () => {
  info = await window.pywebview.api.info();
  render();
  refreshStatus();
  await window.pywebview.api.resize(menuEl.getBoundingClientRect().height);
});
</script>
</body>
</html>
