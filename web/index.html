<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Voice TTS</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/web/app.css">
</head>
<body>

<header class="chrome">
  <h1>Voice TTS</h1>
  <div class="status" id="status" role="status" aria-live="polite">
    <span class="dot"></span><span id="statusText">Đang khởi động…</span>
  </div>
</header>

<main>
  <section class="card">
    <label class="field-label" for="text">Văn bản</label>
    <textarea id="text" spellcheck="false"
      placeholder="Chào bạn, hôm nay chúng ta sẽ deploy một model text-to-speech mới lên production server."></textarea>
    <div class="field-foot">
      <span class="hint">Trộn tiếng Việt và tiếng Anh trong cùng một câu đều đọc được.</span>
      <span class="count" id="count"></span>
    </div>
  </section>

  <div class="group">
  <button class="row" id="voiceBtn" type="button">
    <span class="row__label">Giọng đọc</span>
    <span class="row__value" id="voiceName">—</span>
    <svg class="row__chevron" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <div class="row">
    <span class="row__label">Tốc độ</span>
    <div class="speed" id="speed" role="group" aria-label="Tốc độ đọc">
      <button class="speed__opt" type="button" data-speed="0.75" aria-pressed="false">0.75×</button>
      <button class="speed__opt" type="button" data-speed="1" aria-pressed="true">1×</button>
      <button class="speed__opt" type="button" data-speed="1.25" aria-pressed="false">1.25×</button>
      <button class="speed__opt" type="button" data-speed="1.5" aria-pressed="false">1.5×</button>
    </div>
  </div>

  <div class="row">
    <span class="row__label">Phát âm</span>
    <div class="speed" id="pron" role="group" aria-label="Cách phát âm"
      title="Đặc biệt: đọc POST là &quot;post&quot;, AP là &quot;ây pi&quot;, Board là &quot;bo&quot;, ESP32 là &quot;i ét pi ba hai&quot;">
      <button class="speed__opt" type="button" data-pron="normal" aria-pressed="true">Thường</button>
      <button class="speed__opt" type="button" data-pron="special" aria-pressed="false">Đặc biệt</button>
    </div>
  </div>

  <div class="row">
    <span class="row__label">Lưu dạng</span>
    <div class="speed" id="format" role="group" aria-label="Định dạng file lưu"
      title="WAV: nguyên chất, nặng. MP3, OGG: nhẹ hơn khoảng 10 lần">
      <button class="speed__opt" type="button" data-format="wav" aria-pressed="true">WAV</button>
      <button class="speed__opt" type="button" data-format="mp3" aria-pressed="false">MP3</button>
      <button class="speed__opt" type="button" data-format="ogg" aria-pressed="false">OGG</button>
    </div>
  </div>
  </div>

  <div class="meter" id="meter" aria-hidden="true"></div>
</main>

<footer class="chrome chrome--bottom">
  <button class="btn btn--primary" id="playBtn" type="button" disabled>
    <svg class="btn__icon" id="playIcon" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.8v10.4l9-5.2z" fill="currentColor"/></svg>
    <span id="playLabel">Đọc</span>
  </button>
  <button class="btn btn--icon" id="stopBtn" type="button" disabled aria-label="Dừng" title="Dừng (Esc)">
    <svg class="btn__icon" viewBox="0 0 16 16" aria-hidden="true"><rect x="4" y="4" width="8" height="8" rx="1.6" fill="currentColor"/></svg>
  </button>
  <div class="scrub">
    <input class="scrub__bar" id="seek" type="range" min="0" max="1" step="any" value="0"
      disabled aria-label="Vị trí đang đọc">
    <span class="timecode" id="timecode">0:00</span>
  </div>
  <button class="btn" id="saveBtn" type="button" disabled>Lưu WAV</button>
</footer>

<div class="scrim" id="scrim" hidden></div>
<section class="sheet" id="sheet" hidden aria-label="Chọn giọng đọc">
  <div class="sheet__grip"></div>
  <h2 class="sheet__title">Giọng đọc</h2>
  <div class="sheet__list" id="voiceList"></div>
</section>

<script src="/web/app.js"></script>
</body>
</html>
